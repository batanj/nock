[package]
name = "nock"
version = "0.1.0"
edition = "2024"

[dependencies]
calloop = "0.14"
calloop-wayland-source = "0.4"
smithay-client-toolkit = "0"
wayland-client = "0.31"
skia-safe = { version = "0.89", default-features = false, features = ["gl", "egl", "binary-cache"]}
wayland-egl = "0.32"
